<!doctype html><html lang="en"><meta charset="utf-8"><title>ApplyPilot</title><style>
*{box-sizing:border-box}body{font:14px/1.5 system-ui;width:390px;margin:0;padding:18px;color:#182b21;background:#fafcfb}header{display:flex;align-items:center;gap:8px;margin-bottom:18px}h1{font-size:19px;margin:0 auto 0 0}button,select{font:inherit}button{padding:9px 13px;border:1px solid #d4ded7;border-radius:9px;background:white;cursor:pointer}button:disabled{display:none}header button{font-size:12px;padding:7px 9px}.numbers{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:16px}.number{border:1px solid #dce5df;background:white;border-radius:10px;padding:12px}.number strong{font-size:26px;display:block}.number span{font-size:11px;color:#4d6356}article{border-top:1px solid #dce5df;padding:16px 0}article strong{display:block;font-size:14px}article small{display:block;color:#4b6254;margin:4px 0}.job-pay{font-weight:650;color:#245c3c}.attention-position{font-size:12px;margin-bottom:6px;color:#3e6b51}article button{margin-top:8px;background:#193f31;color:white}#message,.job-action-status{white-space:pre-wrap;font-size:12px}#message:empty,.job-action-status:empty{display:none}#controls[hidden]{display:none}#controls{border:1px solid #dce5df;padding:12px;border-radius:10px;margin-bottom:16px}#controls select{max-width:100%;margin:8px 0}#controls button{margin:4px 0}
